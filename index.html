<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kursi Rotan 3D & VR</title>
    
    <!-- Memuat Library A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- Memuat Library Orbit Controls -->
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/orbit-controls/dist/aframe-orbit-controls.min.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Kanvas Utama 3D / VR (Antialias & Shadow dimatikan agar sangat ringan dan responsif di HP) -->
    <a-scene 
        renderer="colorManagement: true; antialias: true;" 
        xr-mode-ui="enabled: true"
        loading-screen="dotsColor: #333333; backgroundColor: #ffffff"
        vr-mode-ui="enabled: true">

        <!-- Memuat File .glb -->
        <a-assets>
            <a-asset-item id="model-kursi" src="kursi_rotan.glb"></a-asset-item>
        </a-assets>

        <!-- Pencahayaan Merata untuk Background Putih -->
        <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
        <a-light type="directional" position="2 4 3" intensity="0.9"></a-light>
        <a-light type="directional" position="-2 2 -3" intensity="0.6"></a-light>

        <!-- Background Putih Bersih -->
        <a-sky color="#ffffff"></a-sky>

        <!-- Objek Utama: Kursi Rotan -->
        <a-entity 
            id="objek-rotan"
            gltf-model="#model-kursi" 
            position="0 -0.45 0" 
            rotation="0 25 0"
            scale="1 1 1">
        </a-entity>

        <!-- Kamera Pengunjung: Jarak diperdekat & rotasi dibuat lebih cepat/responsif -->
        <a-entity 
            camera 
            look-controls="enabled: false" 
            orbit-controls="
                target: 0 0 0; 
                initialPosition: 0 0.35 1.35; 
                minDistance: 0.7; 
                maxDistance: 3.5; 
                rotateSpeed: 1.5; 
                zoomSpeed: 1.2; 
                enablePan: false; 
                enableDamping: true; 
                dampingFactor: 0.1;">
        </a-entity>

    </a-scene>

</body>
</html>
