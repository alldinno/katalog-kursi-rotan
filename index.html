<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog Kursi 3D & VR</title>
    
    <!-- Memuat Library A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- Memuat Library Orbit Controls -->
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/orbit-controls/dist/aframe-orbit-controls.min.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background-color 0.25s ease;
            touch-action: none;
        }

        a-scene {
            width: 100vw;
            height: 100dvh;
            display: block;
        }

        /* Panel Tombol Pindah Kursi Responsif di Bagian Bawah */
        #chair-switcher {
            position: fixed;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #e2e2e2;
            border-radius: 999px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(8px);
            max-width: 94vw;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chair-btn {
            border: none;
            background: #f2f2f2;
            color: #222222;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .chair-btn.active {
            background: #1f1f1f;
            color: #ffffff;
        }

        @media (min-width: 640px) {
            #chair-switcher {
                bottom: 20px;
                gap: 8px;
                padding: 8px 10px;
            }
            .chair-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- Tombol untuk Pindah Antar 4 Kursi -->
    <div id="chair-switcher" role="group" aria-label="Pilih Model Kursi">
        <button class="chair-btn active" data-src="kursi_rotan.glb">Kursi 1</button>
        <button class="chair-btn" data-src="kursi_rotan1.glb">Kursi 2</button>
        <button class="chair-btn" data-src="kursi_rotan2.glb">Kursi 3</button>
        <button class="chair-btn" data-src="kursi_rotan3.glb">Kursi 4</button>
    </div>

    <!-- Kanvas Utama 3D / VR -->
    <a-scene 
        renderer="colorManagement: true; antialias: true; powerPreference: high-performance;" 
        xr-mode-ui="enabled: true"
        loading-screen="dotsColor: #333333; backgroundColor: #ffffff"
        vr-mode-ui="enabled: true">

        <!-- Pencahayaan Merata -->
        <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
        <a-light type="directional" position="2 4 3" intensity="0.9"></a-light>
        <a-light type="directional" position="-2 2 -3" intensity="0.6"></a-light>

        <!-- Background Dinamis -->
        <a-sky id="latar-belakang" color="#ffffff"></a-sky>

        <!-- Objek Kursi Aktif -->
        <a-entity 
            id="objek-rotan"
            gltf-model="kursi_rotan.glb" 
            position="0 -0.45 0" 
            rotation="0 25 0"
            scale="1 1 1">
        </a-entity>

        <!-- Kamera Pengunjung -->
        <a-entity 
            id="kamera-utama"
            camera 
            look-controls="enabled: false" 
            orbit-controls="
                target: 0 0 0; 
                initialPosition: 0 0.35 1.5; 
                minDistance: 0.45; 
                maxDistance: 5.5; 
                rotateSpeed: 1.6; 
                zoomSpeed: 1.25; 
                enablePan: false; 
                enableDamping: true; 
                dampingFactor: 0.12;">
        </a-entity>

    </a-scene>

    <script>
        const buttons = document.querySelectorAll('.chair-btn');
        const chairEntity = document.querySelector('#objek-rotan');
        const cameraEntity = document.querySelector('#kamera-utama');
        const skyEntity = document.querySelector('#latar-belakang');

        // Pengaturan dasar per kursi
        const chairConfig = {
            'kursi_rotan.glb': {
                scale: 1,
                mobileScaleFactor: 0.85,
                baseY: -0.45,
                offsetX: 0,
                offsetY: 0,
                offsetZ: 0,
                autoCenter: false,
                bg: '#ffffff'
            },
            'kursi_rotan1.glb': {
                scale: 0.45,
                mobileScaleFactor: 0.85,
                baseY: -0.45,
                offsetX: 0,
                offsetY: -0.05,
                offsetZ: 0,
                autoCenter: true,
                bg: '#7c4d2b'
            },
            'kursi_rotan2.glb': {
                scale: 0.55,
                mobileScaleFactor: 0.82,
                baseY: -0.45,
                offsetX: 0,
                offsetY: 0,
                offsetZ: 0,
                autoCenter: false,
                bg: '#ffffff'
            },
            'kursi_rotan3.glb': {
                scale: 0.035,
                mobileScaleFactor: 0.82,
                baseY: -0.45,
                offsetX: 0,
                offsetY: -0.05,
                offsetZ: 0,
                autoCenter: true,
                bg: '#ffffff'
            }
        };

        let activeConfig = chairConfig['kursi_rotan.glb'];

        function getResponsiveScale(cfg) {
            const isPortrait = window.innerHeight > window.innerWidth;
            const factor = isPortrait ? (cfg.mobileScaleFactor || 0.85) : 1;
            return cfg.scale * factor;
        }

        function updateCameraForViewport() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const zPos = isPortrait ? 1.75 : 1.35;
            const yPos = isPortrait ? 0.38 : 0.35;

            cameraEntity.setAttribute('orbit-controls', {
                target: '0 0 0',
                initialPosition: `0 ${yPos} ${zPos}`,
                minDistance: 0.45,
                maxDistance: 5.5,
                rotateSpeed: 1.6,
                zoomSpeed: 1.25,
                enablePan: false,
                enableDamping: true,
                dampingFactor: 0.12
            });
        }

        function centerModelIfNeeded() {
            const mesh = chairEntity.getObject3D('mesh');
            if (!mesh) return;

            const finalScale = getResponsiveScale(activeConfig);
            chairEntity.object3D.scale.set(finalScale, finalScale, finalScale);
            chairEntity.object3D.position.set(0, activeConfig.baseY, 0);
            chairEntity.object3D.updateMatrixWorld(true);

            if (activeConfig.autoCenter) {
                const box = new THREE.Box3().setFromObject(mesh);
                if (!box.isEmpty()) {
                    const center = new THREE.Vector3();
                    box.getCenter(center);

                    const newX = -center.x + (activeConfig.offsetX || 0);
                    const newY = -center.y + (activeConfig.offsetY || 0);
                    const newZ = -center.z + (activeConfig.offsetZ || 0);

                    chairEntity.object3D.position.set(newX, newY, newZ);
                }
            } else {
                chairEntity.object3D.position.set(
                    activeConfig.offsetX || 0,
                    activeConfig.baseY + (activeConfig.offsetY || 0),
                    activeConfig.offsetZ || 0
                );
            }
        }

        chairEntity.addEventListener('model-loaded', () => {
            centerModelIfNeeded();
        });

        window.addEventListener('resize', () => {
            updateCameraForViewport();
            centerModelIfNeeded();
        });

        buttons.forEach((btn) => {
            btn.addEventListener('click', () => {
                const fileName = btn.getAttribute('data-src');
                const config = chairConfig[fileName];

                if (!config) return;

                activeConfig = config;
                const finalScale = getResponsiveScale(config);
                chairEntity.setAttribute('scale', `${finalScale} ${finalScale} ${finalScale}`);

                if (chairEntity.getAttribute('gltf-model') === fileName) {
                    centerModelIfNeeded();
                } else {
                    chairEntity.setAttribute('gltf-model', fileName);
                }

                skyEntity.setAttribute('color', config.bg);
                document.body.style.backgroundColor = config.bg;

                buttons.forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        updateCameraForViewport();
    </script>

</body>
</html>
