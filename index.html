<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Katalog Kursi 3D & VR</title>
    
    <!-- Memuat Library A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- Memuat Library Orbit Controls -->
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/orbit-controls/dist/aframe-orbit-controls.min.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background-color 0.25s ease;
        }

        /* Panel Tombol Pindah Kursi di Bagian Bawah Tengah */
        #chair-switcher {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 8px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #e2e2e2;
            border-radius: 999px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(6px);
            max-width: 92vw;
            overflow-x: auto;
        }

        .chair-btn {
            border: none;
            background: #f2f2f2;
            color: #222222;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .chair-btn.active {
            background: #1f1f1f;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Tombol untuk Pindah Antar 4 Kursi -->
    <div id="chair-switcher" role="group" aria-label="Pilih Model Kursi">
        <button class="chair-btn active" data-src="kursi_rotan.glb">Kursi 1</button>
        <button class="chair-btn" data-src="kursi_rotan1.glb">Kursi 2</button>
        <button class="chair-btn" data-src="kursi_rotan2.glb">Kursi 3</button>
        <button class="chair-btn" data-src="kursi_rotan3.glb">Kursi 4</button>
    </div>

    <!-- Kanvas Utama 3D / VR -->
    <a-scene 
        renderer="colorManagement: true; antialias: true;" 
        xr-mode-ui="enabled: true"
        loading-screen="dotsColor: #333333; backgroundColor: #ffffff"
        vr-mode-ui="enabled: true">

        <!-- Memuat Semua File .glb -->
        <a-assets>
            <a-asset-item id="asset-kursi-1" src="kursi_rotan.glb"></a-asset-item>
            <a-asset-item id="asset-kursi-2" src="kursi_rotan1.glb"></a-asset-item>
            <a-asset-item id="asset-kursi-3" src="kursi_rotan2.glb"></a-asset-item>
            <a-asset-item id="asset-kursi-4" src="kursi_rotan3.glb"></a-asset-item>
        </a-assets>

        <!-- Pencahayaan Merata -->
        <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
        <a-light type="directional" position="2 4 3" intensity="0.9"></a-light>
        <a-light type="directional" position="-2 2 -3" intensity="0.6"></a-light>

        <!-- Background Dinamis -->
        <a-sky id="latar-belakang" color="#ffffff"></a-sky>

        <!-- Objek Kursi Aktif -->
        <a-entity 
            id="objek-rotan"
            gltf-model="#asset-kursi-1" 
            position="0 -0.45 0" 
            rotation="0 25 0"
            scale="1 1 1">
        </a-entity>

        <!-- Kamera Pengunjung -->
        <a-entity 
            id="kamera-utama"
            camera 
            look-controls="enabled: false" 
            orbit-controls="
                target: 0 0 0; 
                initialPosition: 0 0.35 1.35; 
                minDistance: 0.7; 
                maxDistance: 3.5; 
                rotateSpeed: 1.5; 
                zoomSpeed: 1.2; 
                enablePan: false; 
                enableDamping: true; 
                dampingFactor: 0.1;">
        </a-entity>

    </a-scene>

    <script>
        const buttons = document.querySelectorAll('.chair-btn');
        const chairEntity = document.querySelector('#objek-rotan');
        const skyEntity = document.querySelector('#latar-belakang');

        // Konfigurasi per kursi: asset, ukuran (scale), posisi (position), dan warna background
        const chairConfig = {
            'kursi_rotan.glb': {
                asset: '#asset-kursi-1',
                scale: '1 1 1',
                position: '0 -0.45 0',
                bg: '#ffffff'
            },
            'kursi_rotan1.glb': {
                asset: '#asset-kursi-2',
                scale: '0.25 0.25 0.25',
                position: '0 -0.45 0',
                bg: '#7c4d2b' // Warna cokelat untuk Kursi 2
            },
            'kursi_rotan2.glb': {
                asset: '#asset-kursi-3',
                scale: '1 1 1',
                position: '0 -0.45 0',
                bg: '#ffffff'
            },
            'kursi_rotan3.glb': {
                asset: '#asset-kursi-4',
                scale: '0.08 0.08 0.08',
                position: '0 -0.25 0',
                bg: '#ffffff'
            }
        };

        buttons.forEach((btn) => {
            btn.addEventListener('click', () => {
                const fileName = btn.getAttribute('data-src');
                const config = chairConfig[fileName];

                if (!config) return;

                chairEntity.setAttribute('gltf-model', config.asset);
                chairEntity.setAttribute('scale', config.scale);
                chairEntity.setAttribute('position', config.position);

                skyEntity.setAttribute('color', config.bg);
                document.body.style.backgroundColor = config.bg;

                buttons.forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>

</body>
</html>
